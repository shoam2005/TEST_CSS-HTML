<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=shield,bolt,chevron_left,chevron_right,travel,vital_signs" />
</head>

<body class="clarity-city">
    <header>
        <label id="icon_around" for="icon_around">
            <svg id="svg_icon_around" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960"
                width="24px" fill="#1f1f1f">
                <path
                    d="M480-80q-139-35-229.5-159.5T160-516v-244l320-120 320 120v244q0 152-90.5 276.5T480-80Zm0-84q104-33 172-132t68-220v-189l-240-90-240 90v189q0 121 68 220t172 132Zm0-316Z" />
            </svg>
        </label>
        <label id="sigint_ops" for="">SIGINT OPS</label>
        <div id="secure_online">
            <label id="arond_header_change" for=""></label>
            <div>
                SECURE
            </div>
            <label id="around_header" for=""></label>
            <div>ONLINE</div>
        </div>
    </header>
    <main>
        <section id="center_section">
            <div class='radar'>
                <div class='sweep'></div>
            </div>
            <label class="point_radar point1" for=""></label>
             <label class="point_radar point2" for=""></label>
              <label class="point_radar point3" for=""></label>
            <div id="div_text_center">
                <div class="font_green div24"> 24</div>
                <span class="font_gray">ACTIVE SIGNALS</span>
                <div class="font_green div07">07</div>
                <span class="font_gray">PRIORITY ALERTS</span>
            </div>

        </section>
        <section id="section_buttons">
            <button class="button">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                    fill="#1f1f1f">
                    <path
                        d="m422-232 207-248H469l29-227-185 267h139l-30 208ZM320-80l40-280H160l360-520h80l-40 320h240L400-80h-80Zm151-390Z" />
                </svg>
                New Brief
            </button>
            <button class="button">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                    fill="#1f1f1f">
                    <path d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z" />
                </svg>
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                    fill="#1f1f1f">
                    <path d="M504-480 320-664l56-56 240 240-240 240-56-56 184-184Z" />
                </svg>
                Decode
            </button>
            <button class="button">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                    fill="#1f1f1f">
                    <path
                        d="m397-115-99-184-184-99 71-70 145 25 102-102-317-135 84-86 385 68 124-124q23-23 57-23t57 23q23 23 23 56.5T822-709L697-584l68 384-85 85-136-317-102 102 26 144-71 71Z" />
                </svg>
                Request Drone
            </button>
        </section>

        <section id="section_cards">
            <div class="card">
                <label id="label_critical" for=""> CRITICAL</label>
                <span></span>

                <label class="lable_progress" for="file">Oparation Nightfall</label>

                <progress id="file" max="100" value="65">65%</progress>
            </div>
            <div class="card">
                <label id="label_high" for="">HIGH</label>
                <span></span>

                <label class="lable_progress" for="file">Signal Intercept Alpha</label>

                <progress id="file" max="100" value="40">40%</progress>

            </div>
            <div class="card">
                <label id="lable_medium" for="">MEDIUM</label>
                <span></span>

                <label class="lable_progress" for="file">Asset Recovery</label>

                <progress id="file" max="100" value="15">15%</progress>

            </div>
            <div class="card">
                <label id="label_high" for="">HIGH</label>
                <span></span>

                <label class="lable_progress" for="file">Cyber Defense Grid</label>

                <progress id="file" max="100" value="80">80%</progress>
                

            </div>
        </section>
        <section id="section_status">
            <label for=""></label>
            <div>THREAT DETECTED</div>
        </section>
    </main>

        </svg>


        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f">
            <path
                d="M320-240h320v-80H320v80Zm0-160h320v-80H320v80ZM240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H240Zm280-520v-200H240v640h480v-440H520ZM240-800v200-200 640-640Z" />

        <label for="">
